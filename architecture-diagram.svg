<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #050507; }
      .grid-line { stroke: #14141c; stroke-width: 1; }

      .node-box {
        fill: #0a0a10;
        stroke-width: 2;
      }
      .node-cyan { stroke: #00f0ff; }
      .node-pink { stroke: #ff2fd0; }
      .node-green { stroke: #39ff8f; }
      .node-purple { stroke: #b34bff; }
      .node-amber { stroke: #ffb020; }

      .label {
        font-size: 20px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .sublabel {
        font-size: 12px;
        font-weight: 400;
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 1px;
      }
      .text-cyan   { fill: #7cf7ff; }
      .text-pink   { fill: #ff8de9; }
      .text-green  { fill: #9dffc4; }
      .text-purple { fill: #d2a4ff; }
      .text-amber  { fill: #ffd28a; }
      .text-dim    { fill: #6d6d7a; }

      .flow-line {
        fill: none;
        stroke-width: 2.5;
        stroke-dasharray: 6 10;
        animation: flow 1.2s linear infinite;
      }
      .flow-cyan   { stroke: #00f0ff; }
      .flow-pink   { stroke: #ff2fd0; }
      .flow-green  { stroke: #39ff8f; }
      .flow-purple { stroke: #b34bff; }
      .flow-amber  { stroke: #ffb020; }

      @keyframes flow {
        to { stroke-dashoffset: -16; }
      }

      @keyframes pulse-cyan {
        0%, 100% { filter: drop-shadow(0 0 3px #00f0ff) drop-shadow(0 0 8px #00f0ff88); }
        50%      { filter: drop-shadow(0 0 8px #00f0ff) drop-shadow(0 0 22px #00f0ffcc); }
      }
      @keyframes pulse-pink {
        0%, 100% { filter: drop-shadow(0 0 3px #ff2fd0) drop-shadow(0 0 8px #ff2fd088); }
        50%      { filter: drop-shadow(0 0 8px #ff2fd0) drop-shadow(0 0 22px #ff2fdcc); }
      }
      @keyframes pulse-green {
        0%, 100% { filter: drop-shadow(0 0 3px #39ff8f) drop-shadow(0 0 8px #39ff8f88); }
        50%      { filter: drop-shadow(0 0 8px #39ff8f) drop-shadow(0 0 22px #39ff8fcc); }
      }
      @keyframes pulse-purple {
        0%, 100% { filter: drop-shadow(0 0 3px #b34bff) drop-shadow(0 0 8px #b34bff88); }
        50%      { filter: drop-shadow(0 0 8px #b34bff) drop-shadow(0 0 22px #b34bffcc); }
      }
      @keyframes pulse-amber {
        0%, 100% { filter: drop-shadow(0 0 3px #ffb020) drop-shadow(0 0 8px #ffb02088); }
        50%      { filter: drop-shadow(0 0 8px #ffb020) drop-shadow(0 0 22px #ffb020cc); }
      }

      .glow-cyan   { animation: pulse-cyan 2.6s ease-in-out infinite; }
      .glow-pink   { animation: pulse-pink 2.6s ease-in-out infinite; animation-delay: .3s; }
      .glow-green  { animation: pulse-green 2.6s ease-in-out infinite; animation-delay: .6s; }
      .glow-purple { animation: pulse-purple 2.6s ease-in-out infinite; animation-delay: .9s; }
      .glow-amber  { animation: pulse-amber 2.6s ease-in-out infinite; animation-delay: 1.2s; }

      .dot {
        animation: dotmove 1.2s linear infinite;
      }
      @keyframes dotmove {
        0%   { opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>

    <radialGradient id="bgGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#141225" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect class="bg" x="0" y="0" width="900" height="640"/>
  <rect x="0" y="0" width="900" height="640" fill="url(#bgGlow)"/>

  <!-- faint grid -->
  <g opacity="0.5">
    <line class="grid-line" x1="0" y1="80"  x2="900" y2="80"/>
    <line class="grid-line" x1="0" y1="160" x2="900" y2="160"/>
    <line class="grid-line" x1="0" y1="240" x2="900" y2="240"/>
    <line class="grid-line" x1="0" y1="320" x2="900" y2="320"/>
    <line class="grid-line" x1="0" y1="400" x2="900" y2="400"/>
    <line class="grid-line" x1="0" y1="480" x2="900" y2="480"/>
    <line class="grid-line" x1="0" y1="560" x2="900" y2="560"/>
  </g>

  <!-- title -->
  <text x="450" y="34" class="label text-cyan" font-size="22" style="letter-spacing:2px;">SOUNDFIND — PRODUCTION ARCHITECTURE</text>

  <!-- ===================== CONNECTIONS ===================== -->

  <!-- User -> Frontend -->
  <path class="flow-line flow-cyan" d="M450,108 L450,150"/>
  <!-- Frontend -> API -->
  <path class="flow-line flow-cyan" d="M450,208 L450,250"/>
  <!-- API -> CLAP -->
  <path class="flow-line flow-pink" d="M420,300 C 340,330 280,340 240,368"/>
  <!-- API -> Vector DB -->
  <path class="flow-line flow-green" d="M480,300 C 560,330 620,340 660,368"/>
  <!-- CLAP -> Cloud Storage -->
  <path class="flow-line flow-purple" d="M260,428 C 320,470 380,490 420,508"/>
  <!-- Vector DB -> Cloud Storage -->
  <path class="flow-line flow-purple" d="M640,428 C 580,470 520,490 480,508"/>
  <!-- Cloud Storage -> Audio Files -->
  <path class="flow-line flow-amber" d="M450,548 L450,580"/>

  <!-- ===================== NODES ===================== -->

  <!-- User -->
  <g class="glow-cyan">
    <rect class="node-box node-cyan" x="370" y="60" width="160" height="48" rx="10"/>
    <text x="450" y="84" class="label text-cyan">USER</text>
  </g>

  <!-- Frontend -->
  <g class="glow-cyan">
    <rect class="node-box node-cyan" x="350" y="160" width="200" height="48" rx="10"/>
    <text x="450" y="184" class="label text-cyan">Frontend</text>
  </g>

  <!-- API -->
  <g class="glow-pink">
    <rect class="node-box node-pink" x="360" y="252" width="180" height="48" rx="10"/>
    <text x="450" y="276" class="label text-pink">API</text>
  </g>

  <!-- CLAP -->
  <g class="glow-pink">
    <rect class="node-box node-pink" x="140" y="370" width="200" height="58" rx="10"/>
    <text x="240" y="392" class="label text-pink">CLAP</text>
    <text x="240" y="412" class="sublabel text-dim">TEXT / AUDIO ENCODER</text>
  </g>

  <!-- Vector DB -->
  <g class="glow-green">
    <rect class="node-box node-green" x="560" y="370" width="200" height="58" rx="10"/>
    <text x="660" y="392" class="label text-green">Vector DB</text>
    <text x="660" y="412" class="sublabel text-dim">CHROMADB</text>
  </g>

  <!-- Cloud Storage -->
  <g class="glow-purple">
    <rect class="node-box node-purple" x="350" y="510" width="200" height="48" rx="10"/>
    <text x="450" y="534" class="label text-purple">Cloud Storage</text>
  </g>

  <!-- Audio Files -->
  <g class="glow-amber">
    <rect class="node-box node-amber" x="360" y="582" width="180" height="44" rx="10"/>
    <text x="450" y="604" class="label text-amber" font-size="16">Audio Files</text>
  </g>

  <!-- traveling dots along main spine for extra motion -->
  <circle r="4" fill="#00f0ff" class="dot">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M450,108 L450,150"/>
  </circle>
  <circle r="4" fill="#00f0ff" class="dot" style="animation-delay:.15s">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M450,208 L450,250"/>
  </circle>
  <circle r="4" fill="#ff2fd0" class="dot" style="animation-delay:.3s">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M420,300 C 340,330 280,340 240,368"/>
  </circle>
  <circle r="4" fill="#39ff8f" class="dot" style="animation-delay:.45s">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M480,300 C 560,330 620,340 660,368"/>
  </circle>
  <circle r="4" fill="#b34bff" class="dot" style="animation-delay:.6s">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M260,428 C 320,470 380,490 420,508"/>
  </circle>
  <circle r="4" fill="#b34bff" class="dot" style="animation-delay:.75s">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M640,428 C 580,470 520,490 480,508"/>
  </circle>
  <circle r="4" fill="#ffb020" class="dot" style="animation-delay:.9s">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M450,548 L450,580"/>
  </circle>
</svg>
